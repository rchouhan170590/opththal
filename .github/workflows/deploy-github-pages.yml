# Publishes subdirectory/publish as the GitHub Pages site root (static HTML/CSS/JS).
#
# Required once per repo (otherwise deploy APIs return 404):
#   Settings → Pages → Build and deployment → Source → GitHub Actions
#   https://github.com/<owner>/<repo>/settings/pages
#
# We intentionally skip actions/configure-pages: it calls "get Pages site" and fails
# with Not Found until the setting above is saved. Plain static deploy does not need it.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: subdirectory/publish

      - id: deployment
        uses: actions/deploy-pages@v5
