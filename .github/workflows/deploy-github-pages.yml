# Publishes subdirectory/publish to the gh-pages branch.
# This avoids the deploy-pages "404 / Get Pages site failed" error, which only goes
# away after manually setting Source = "GitHub Actions" in repo Pages settings.
#
# One-time setup (after the first successful run of this workflow):
#   https://github.com/rchouhan170590/opththal/settings/pages
#   Build and deployment
#     Source: Deploy from a branch
#     Branch: gh-pages    Folder: / (root)    Save
#
# Site will be served at:
#   https://rchouhan170590.github.io/opththal/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add .nojekyll
        run: touch subdirectory/publish/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./subdirectory/publish
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.sha }}"
