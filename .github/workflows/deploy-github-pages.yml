# Publishes subdirectory/publish as the GitHub Pages site root (static HTML/CSS/JS).
#
# deploy-pages returns HTTP 404 until Pages "Source" is GitHub Actions (not a branch).
# If Source is "Deploy from a branch", this workflow will always fail at deploy — switch it:
#   https://github.com/rchouhan170590/opththal/settings/pages
#   Build and deployment → Source → select "GitHub Actions" → save (ignore template prompts
#   if this workflow file is already on the default branch).
#
# We skip actions/configure-pages; plain static deploy does not need it.

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: subdirectory/publish

      - id: deployment
        uses: actions/deploy-pages@v5
