# Deploys the full study portal (root index.html + chapters/ + assets/) to gh-pages.
#
# GitHub Pages settings (one-time — already configured):
#   https://github.com/rchouhan170590/opththal/settings/pages
#   Source: Deploy from a branch  |  Branch: gh-pages  |  Folder: / (root)
#
# Site: https://rchouhan170590.github.io/opththal/

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add .nojekyll (prevents Jekyll from hiding assets/ folder)
        run: touch .nojekyll

      - name: Deploy site root to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          exclude_assets: '.github,subdirectory,deploy-to-repo.sh,requirements.txt'
          commit_message: "deploy: ${{ github.sha }}"
